name: NuGet Publish

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  pack-and-publish:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore "src/EntityFrameworkCore.Sqlite.Legacy/EntityFrameworkCore.Sqlite.Legacy.csproj"

      - name: Build
        run: dotnet build "src/EntityFrameworkCore.Sqlite.Legacy/EntityFrameworkCore.Sqlite.Legacy.csproj" -c Release --no-restore

      - name: Pack
        run: dotnet pack "src/EntityFrameworkCore.Sqlite.Legacy/EntityFrameworkCore.Sqlite.Legacy.csproj" -c Release --no-build -o artifacts

      - name: Validate NuGet API key
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.NUGET_API_KEY }}")) {
            throw "NUGET_API_KEY não configurado nos Secrets do repositório."
          }

      - name: Publish NuGet
        run: |
          $packages = Get-ChildItem -Path "artifacts" -Filter "*.nupkg" -File
          if ($packages.Count -eq 0) {
            throw "Nenhum pacote .nupkg encontrado na pasta artifacts."
          }

          foreach ($pkg in $packages) {
            Write-Host "Publicando $($pkg.FullName)"
            dotnet nuget push "$($pkg.FullName)" --api-key "${{ secrets.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
          }

