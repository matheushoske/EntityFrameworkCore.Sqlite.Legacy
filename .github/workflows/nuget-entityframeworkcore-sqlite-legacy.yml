name: NuGet Publish

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack-and-publish:
    runs-on: windows-latest
    environment: st
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY || vars.NUGET_API_KEY }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Resolve package version and tag
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $tag = "${{ github.ref_name }}"
            $version = $tag.TrimStart('v')
          } else {
            $version = "1.0.0-ci.${{ github.run_number }}"
            $tag = "v1.0.0-ci.$(Get-Date -Format 'yyyyMMddHHmmss')-${{ github.run_number }}"
          }
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACKAGE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: |
          dotnet restore "src/EntityFrameworkCore.Sqlite.Legacy/EntityFrameworkCore.Sqlite.Legacy.csproj"
          dotnet restore "src/EntityFrameworkCore.Sqlite.Legacy/Ef31/EntityFrameworkCore.Sqlite.Legacy.Ef31.csproj"

      - name: Build
        run: |
          dotnet build "src/EntityFrameworkCore.Sqlite.Legacy/EntityFrameworkCore.Sqlite.Legacy.csproj" -c Release --no-restore -p:Version="$env:PACKAGE_VERSION"
          dotnet build "src/EntityFrameworkCore.Sqlite.Legacy/Ef31/EntityFrameworkCore.Sqlite.Legacy.Ef31.csproj" -c Release --no-restore -p:Version="$env:PACKAGE_VERSION"

      - name: Pack
        run: |
          dotnet pack "src/EntityFrameworkCore.Sqlite.Legacy/EntityFrameworkCore.Sqlite.Legacy.csproj" -c Release -o artifacts -p:Version="$env:PACKAGE_VERSION"
          dotnet pack "src/EntityFrameworkCore.Sqlite.Legacy/Ef31/EntityFrameworkCore.Sqlite.Legacy.Ef31.csproj" -c Release -o artifacts -p:Version="$env:PACKAGE_VERSION"

      - name: Validate package target frameworks
        run: |
          $mainPkg = Get-ChildItem -Path "artifacts" -Filter "EntityFrameworkCore.Sqlite.Legacy.$env:PACKAGE_VERSION.nupkg" -File | Select-Object -First 1
          if (-not $mainPkg) {
            throw "Pacote principal EntityFrameworkCore.Sqlite.Legacy não foi gerado."
          }

          $ef31Pkg = Get-ChildItem -Path "artifacts" -Filter "EntityFrameworkCore.Sqlite.Legacy.Ef31.$env:PACKAGE_VERSION.nupkg" -File | Select-Object -First 1
          if (-not $ef31Pkg) {
            throw "Pacote EntityFrameworkCore.Sqlite.Legacy.Ef31 não foi gerado."
          }

          $mainInspectDir = Join-Path $env:RUNNER_TEMP "pkg-inspect-main"
          if (Test-Path $mainInspectDir) { Remove-Item $mainInspectDir -Recurse -Force }
          New-Item -ItemType Directory -Path $mainInspectDir | Out-Null
          $mainZipPath = Join-Path $mainInspectDir "pkg.zip"
          Copy-Item $mainPkg.FullName $mainZipPath -Force
          Expand-Archive -Path $mainZipPath -DestinationPath $mainInspectDir -Force

          $mainNet10Dll = Join-Path $mainInspectDir "lib/net10.0/EntityFrameworkCore.Sqlite.Legacy.dll"
          if (-not (Test-Path $mainNet10Dll)) { throw "Pacote inválido: faltou lib/net10.0/EntityFrameworkCore.Sqlite.Legacy.dll" }

          $ef31InspectDir = Join-Path $env:RUNNER_TEMP "pkg-inspect-ef31"
          if (Test-Path $ef31InspectDir) { Remove-Item $ef31InspectDir -Recurse -Force }
          New-Item -ItemType Directory -Path $ef31InspectDir | Out-Null
          $ef31ZipPath = Join-Path $ef31InspectDir "pkg.zip"
          Copy-Item $ef31Pkg.FullName $ef31ZipPath -Force
          Expand-Archive -Path $ef31ZipPath -DestinationPath $ef31InspectDir -Force

          $ef31NetStdDll = Join-Path $ef31InspectDir "lib/netstandard2.0/EntityFrameworkCore.Sqlite.Legacy.Ef31.dll"
          if (-not (Test-Path $ef31NetStdDll)) { throw "Pacote inválido: faltou lib/netstandard2.0/EntityFrameworkCore.Sqlite.Legacy.Ef31.dll" }

      - name: Validate NuGet API key
        run: |
          if ([string]::IsNullOrWhiteSpace("$env:NUGET_API_KEY")) {
            throw "NUGET_API_KEY não configurado (nem em secret, nem em variable do environment/repo)."
          }

      - name: Publish NuGet
        run: |
          $packages = Get-ChildItem -Path "artifacts" -Filter "*.nupkg" -File
          if ($packages.Count -eq 0) {
            throw "Nenhum pacote .nupkg encontrado na pasta artifacts."
          }

          foreach ($pkg in $packages) {
            Write-Host "Publicando $($pkg.FullName)"
            dotnet nuget push "$($pkg.FullName)" --api-key "$env:NUGET_API_KEY" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
          }

      - name: Create tag for this commit
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$env:PACKAGE_TAG" "${{ github.sha }}"
          git push origin "$env:PACKAGE_TAG"

